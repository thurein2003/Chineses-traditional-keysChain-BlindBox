services:
  - type: web
    name: zodiac-mystery-blindbox
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
